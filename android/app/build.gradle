// The built site (dist/) is copied into assets/www and shown in a WebView, so the app works
// offline. Built and signed on GitHub Actions (.github/workflows/android.yml): Google's build
// tools are x86-only. The key is in Actions secrets and ~/Backups/surah-signing-key, never in git.
plugins { id 'com.android.application' }

android {
    namespace 'dev.pages.surahtafsir'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.pages.surahtafsir'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.${System.getenv('VERSION_CODE') ?: '1'}"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'surah'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    androidResources { noCompress += ['json', 'woff2', 'html', 'js', 'css'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
